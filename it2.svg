<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Type-1 fuzzy returns a single membership number; Interval Type-2 returns a range, and its peak is a plateau rather than a single point">
  <!--
    SuperconducTED profile diagram, Cryostat palette (brand/tools/palettes.py, CHOSEN = "cryostat").
    Colours are the dark chart roles in brand/figures/roles.json:
      ground #0A1B24, text and ink #EEF3F5, secondary text #9CA5AA, axis #5A676D,
      panel frame #25353D (the grid role), band fill #18404B, accent #4FD6E6.
    The one colour rule: the accent and the band fill mark the range and nothing else
    (the footprint of uncertainty, its upper and lower membership functions, the plateau of
    the peak and the membership interval at the sample x). The Type-1 curve, its single
    membership value, the sampled points, the type and all other line work are ink.
    No gradients, shadows or glows. Text is live (Space Grotesk for headings, Space Mono for
    labels, with system fallbacks), unlike the brand kit files, whose letters are outlines.
  -->
  <title>Type-1 fuzzy returns a single membership number; Interval Type-2 returns a range, and its peak is a plateau rather than a single point</title>

  <rect width="1200" height="380" fill="#0A1B24" rx="10"/>

  <!-- top label strip -->
  <text x="600" y="32" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9CA5AA" letter-spacing="0.7">Type-1 answers with a number  ·  Interval Type-2 answers with an interval</text>

  <!-- PANEL 1: TYPE-1 -->
  <g transform="translate(30 70)">
    <text x="270" y="0" text-anchor="middle" font-family="'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#EEF3F5">Type-1</text>
    <text x="270" y="22" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#9CA5AA">scalar membership per x</text>

    <rect x="0" y="40" width="540" height="220" rx="6" fill="none" stroke="#25353D" stroke-width="1"/>

    <!-- axis -->
    <line x1="40" y1="220" x2="500" y2="220" stroke="#5A676D" stroke-width="1"/>
    <line x1="40" y1="215" x2="40" y2="225" stroke="#5A676D" stroke-width="1"/>
    <line x1="500" y1="215" x2="500" y2="225" stroke="#5A676D" stroke-width="1"/>
    <text x="40" y="240" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">100µs</text>
    <text x="500" y="240" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">200µs</text>
    <text x="270" y="252" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">T1</text>

    <!-- single membership function (clean triangle): one curve, ink -->
    <path d="M 80 220 L 270 80 L 460 220" fill="none" stroke="#EEF3F5" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- y axis labels -->
    <text x="22" y="82" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9CA5AA">1</text>
    <text x="22" y="224" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9CA5AA">0</text>

    <!-- function label -->
    <text x="270" y="66" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#EEF3F5">μ(T1)</text>

    <!-- sample x: vertical reference at x=180, hits curve at y=146 -->
    <line x1="180" y1="220" x2="180" y2="146" stroke="#EEF3F5" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="174" y1="146" x2="186" y2="146" stroke="#EEF3F5" stroke-width="1.6"/>
    <text x="193" y="151" text-anchor="start" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#EEF3F5" font-weight="700">μ = 0.53</text>
    <text x="193" y="166" text-anchor="start" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">one number</text>

    <!-- sampled point traveling along the curve -->
    <circle r="4.5" fill="#EEF3F5">
      <animate attributeName="cx" values="80;175;270;365;460;365;270;175;80" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;150;80;150;220;150;80;150;220" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- bottom caption -->
    <text x="270" y="282" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#9CA5AA">one curve  ·  one μ per x</text>
  </g>

  <!-- PANEL 2: INTERVAL TYPE-2 -->
  <g transform="translate(630 70)">
    <text x="270" y="0" text-anchor="middle" font-family="'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#EEF3F5">Interval Type-2</text>
    <text x="270" y="22" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#9CA5AA">interval membership per x  ·  peak is a region</text>

    <rect x="0" y="40" width="540" height="220" rx="6" fill="none" stroke="#25353D" stroke-width="1"/>

    <!-- axis -->
    <line x1="40" y1="220" x2="500" y2="220" stroke="#5A676D" stroke-width="1"/>
    <line x1="40" y1="215" x2="40" y2="225" stroke="#5A676D" stroke-width="1"/>
    <line x1="500" y1="215" x2="500" y2="225" stroke="#5A676D" stroke-width="1"/>
    <text x="40" y="240" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">100µs</text>
    <text x="500" y="240" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">200µs</text>
    <text x="270" y="252" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">T1</text>

    <!-- FOU: filled band between UMF (trapezoid) and LMF (triangle): the range -->
    <path d="M 60 220 L 200 80 L 340 80 L 480 220 L 450 220 L 270 115 L 90 220 Z" fill="#18404B" stroke="none"/>

    <!-- UMF: trapezoid with plateau from x=200 to x=340, the band's upper edge -->
    <path d="M 60 220 L 200 80 L 340 80 L 480 220" fill="none" stroke="#4FD6E6" stroke-width="1.7" stroke-linejoin="round"/>
    <!-- LMF: triangle peaking at (270, 115) (dashed), the band's lower edge -->
    <path d="M 90 220 L 270 115 L 450 220" fill="none" stroke="#4FD6E6" stroke-width="1.2" stroke-dasharray="3 2" stroke-linejoin="round"/>

    <!-- y axis labels -->
    <text x="22" y="82" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9CA5AA">1</text>
    <text x="22" y="224" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9CA5AA">0</text>

    <!-- function labels -->
    <text x="380" y="78" text-anchor="start" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#EEF3F5">UMF</text>
    <text x="380" y="156" text-anchor="start" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#EEF3F5">LMF</text>
    <text x="270" y="56" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#EEF3F5">FOU</text>

    <!-- plateau marker: the peak is a range of x, so it wears the accent -->
    <line x1="200" y1="74" x2="340" y2="74" stroke="#4FD6E6" stroke-width="0.8" stroke-dasharray="2 3"/>
    <text x="270" y="68" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA" letter-spacing="0.5">peak as plateau</text>

    <!-- sample x: vertical reference at x=180 -->
    <!-- dashed below the bracket (between axis and LMF) -->
    <line x1="180" y1="220" x2="180" y2="167" stroke="#EEF3F5" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
    <!-- interval bracket itself (LMF to UMF): the range -->
    <line x1="180" y1="167" x2="180" y2="100" stroke="#4FD6E6" stroke-width="2.4"/>
    <line x1="174" y1="100" x2="186" y2="100" stroke="#4FD6E6" stroke-width="1.6"/>
    <line x1="174" y1="167" x2="186" y2="167" stroke="#4FD6E6" stroke-width="1.6"/>

    <!-- interval value text -->
    <text x="193" y="130" text-anchor="start" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#EEF3F5" font-weight="700">μ ∈ [0.4, 0.9]</text>
    <text x="193" y="146" text-anchor="start" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">an interval</text>

    <!-- sample points scattered in the FOU: concrete samples, ink -->
    <g fill="#EEF3F5">
      <circle cx="225" cy="130" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="248" cy="100" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="278" cy="92" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="308" cy="100" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="335" cy="130" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- bottom caption -->
    <text x="270" y="282" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#9CA5AA">a band of curves  ·  an interval of μ per x</text>
  </g>

  <!-- Bottom signature -->
  <text x="600" y="371" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9CA5AA" letter-spacing="0.7">Footprint of uncertainty  ·  the membership of the membership</text>
</svg>
