<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="From a crisp parameter, through a fuzzy ensemble, to an interval that aims to bracket real hardware">
  <!--
    SuperconducTED profile diagram, Cryostat palette (brand/tools/palettes.py, CHOSEN = "cryostat").
    Colours are the dark chart roles in brand/figures/roles.json:
      ground #0A1B24, text and ink #EEF3F5, secondary text #9CA5AA, axis #5A676D,
      panel frame #25353D (the grid role), band fill #18404B, accent #4FD6E6.
    The one colour rule: the accent and the band fill mark the range and nothing else
    (the footprint of uncertainty in the ensemble panel, the interval in the last panel).
    The crisp value, the sampled models, the measured point, the type and all line work are ink.
    No gradients, shadows or glows. Text is live (Space Grotesk for headings, Space Mono for
    labels, with system fallbacks), unlike the brand kit files, whose letters are outlines.
  -->
  <title>From a crisp parameter, through a fuzzy ensemble, to an interval that aims to bracket real hardware</title>

  <rect width="1200" height="380" fill="#0A1B24" rx="10"/>

  <!-- top label strip -->
  <text x="600" y="32" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9CA5AA" letter-spacing="0.7">From a crisp number  ·  to an ensemble  ·  to an interval that aims to bracket real hardware</text>

  <!-- PANEL 1: CRISP -->
  <g transform="translate(50 70)">
    <text x="150" y="0" text-anchor="middle" font-family="'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#EEF3F5">Crisp</text>
    <text x="150" y="22" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#9CA5AA">single point estimate</text>

    <!-- panel outline -->
    <rect x="0" y="40" width="300" height="210" rx="6" fill="none" stroke="#25353D" stroke-width="1"/>

    <!-- axis -->
    <line x1="30" y1="200" x2="270" y2="200" stroke="#5A676D" stroke-width="1"/>
    <line x1="30" y1="195" x2="30" y2="205" stroke="#5A676D" stroke-width="1"/>
    <line x1="270" y1="195" x2="270" y2="205" stroke="#5A676D" stroke-width="1"/>
    <text x="30" y="220" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">100µs</text>
    <text x="270" y="220" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">200µs</text>

    <!-- single point: the crisp value, ink -->
    <line x1="150" y1="200" x2="150" y2="120" stroke="#EEF3F5" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
    <circle cx="150" cy="200" r="6.5" fill="#EEF3F5"/>

    <!-- label -->
    <text x="150" y="110" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#EEF3F5" font-weight="700">T1 = 142 µs</text>
    <text x="150" y="240" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">what Aer accepts today</text>
  </g>

  <!-- ARROW 1 -->
  <g transform="translate(360 195)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#EEF3F5" stroke-width="1.5"/>
    <polygon points="55,-6 68,0 55,6" fill="#EEF3F5"/>
    <text x="34" y="-14" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#EEF3F5" letter-spacing="0.6">TSK</text>
    <text x="34" y="22" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">fuzzify</text>
  </g>

  <!-- PANEL 2: ENSEMBLE -->
  <g transform="translate(450 70)">
    <text x="150" y="0" text-anchor="middle" font-family="'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#EEF3F5">Ensemble</text>
    <text x="150" y="22" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#9CA5AA">fuzzy uncertainty envelope</text>

    <rect x="0" y="40" width="300" height="210" rx="6" fill="none" stroke="#25353D" stroke-width="1"/>

    <!-- footprint of uncertainty: the band between the outer and the inner membership function (the range) -->
    <path d="M 40 200 L 100 130 L 150 95 L 200 130 L 260 200 Z M 60 200 L 110 150 L 150 120 L 190 150 L 240 200 Z" fill="#18404B" fill-rule="evenodd" stroke="none"/>
    <!-- outer membership function, the band's upper edge -->
    <path d="M 40 200 L 100 130 L 150 95 L 200 130 L 260 200" fill="none" stroke="#4FD6E6" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- inner membership function, the band's lower edge (interval type 2 hint) -->
    <path d="M 60 200 L 110 150 L 150 120 L 190 150 L 240 200" fill="none" stroke="#4FD6E6" stroke-width="1" stroke-dasharray="3 2" stroke-linejoin="round"/>

    <!-- axis -->
    <line x1="30" y1="200" x2="270" y2="200" stroke="#5A676D" stroke-width="1"/>

    <!-- sampled points (the NoiseModel ensemble): concrete models, ink -->
    <g fill="#EEF3F5">
      <circle cx="105" cy="200" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="128" cy="200" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="200" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="172" cy="200" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="195" cy="200" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <text x="150" y="82" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#EEF3F5">μ(T1)</text>
    <text x="150" y="240" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">N NoiseModels sampled from the envelope</text>
  </g>

  <!-- ARROW 2 -->
  <g transform="translate(760 195)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#EEF3F5" stroke-width="1.5"/>
    <polygon points="55,-6 68,0 55,6" fill="#EEF3F5"/>
    <text x="34" y="-14" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#EEF3F5" letter-spacing="0.6">Aer</text>
    <text x="34" y="22" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">simulate</text>
  </g>

  <!-- PANEL 3: INTERVAL -->
  <g transform="translate(850 70)">
    <text x="150" y="0" text-anchor="middle" font-family="'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="500" fill="#EEF3F5">Interval</text>
    <text x="150" y="22" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#9CA5AA">bracketed prediction</text>

    <rect x="0" y="40" width="300" height="210" rx="6" fill="none" stroke="#25353D" stroke-width="1"/>

    <!-- interval band (the range) -->
    <rect x="65" y="165" width="170" height="60" fill="#18404B"/>

    <!-- left and right bounds, drawn as the brackets of the mark (the range) -->
    <path d="M 74 155 L 65 155 L 65 230 L 74 230" fill="none" stroke="#4FD6E6" stroke-width="2.4" stroke-linejoin="miter"/>
    <path d="M 226 155 L 235 155 L 235 230 L 226 230" fill="none" stroke="#4FD6E6" stroke-width="2.4" stroke-linejoin="miter"/>
    <text x="65" y="146" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#EEF3F5">p_lo</text>
    <text x="235" y="146" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#EEF3F5">p_hi</text>

    <!-- axis -->
    <line x1="30" y1="200" x2="270" y2="200" stroke="#5A676D" stroke-width="1"/>

    <!-- the real hardware's point (a measurement: ink, ringed in the ground), drifting inside the interval -->
    <circle cx="155" cy="200" r="6" fill="#EEF3F5" stroke="#0A1B24" stroke-width="2">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="140;170;140" dur="6s" repeatCount="indefinite"/>
    </circle>

    <text x="150" y="92" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#EEF3F5" font-weight="700">aim: real IBM ∈ [p_lo, p_hi]</text>
    <text x="150" y="243" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9CA5AA">across calibration cycles, not just one</text>
  </g>

  <!-- Bottom signature -->
  <text x="600" y="355" text-anchor="middle" font-family="'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9CA5AA" letter-spacing="0.7">SuperconducTED  ·  Factory / Ensemble pattern  ·  IT2 fuzzy envelope</text>
</svg>
